packages:
  - ".sandcastle"
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  msgpackr-extract: true
  netlify-cli: true
  sharp: true
  unix-dgram: true
minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - chokidar@4.0.3
  - "@netlify/edge-bundler@14.10.3"
  - "@netlify/zip-it-and-ship-it@14.7.1"
  - "@netlify/serverless-functions-api@2.16.0"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
    "@opentelemetry/api": "*"
    "@vitest/browser-preview": "*"
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
  "@vitest/coverage-v8": 5.0.5
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # Patched transitive versions. Selectors stay on the installed major.
  "proxy-addr@<2.0.8": 2.0.8
  "@fastify/busboy@<3.2.2": 3.2.3
  "brace-expansion@>=2 <2.1.7": 2.1.7
  "brace-expansion@>=5 <5.0.12": 5.0.12
  "fast-uri@>=3 <3.1.8": 3.1.9
  "fast-uri@>=4 <4.1.5": 4.1.5
  "follow-redirects@<1.16.1": 1.16.1
  "image-size@<=2.0.2": 2.0.4
  "ip-address@<10.7.1": 10.7.4
  "js-yaml@>=4 <4.3.2": 4.3.2
  "nanoid@>=3 <3.3.18": 3.3.20
  "postcss@<8.5.23": 8.5.31
  "source-map-js@<1.2.2": 1.2.2
  "@hono/node-server@<1.19.15": 1.19.17
  "hono@<4.13.11": 4.13.13
  "qs@<6.16.0": 6.16.1
  "svgo@<4.1.0": 4.1.0
  "tar@>=7.5.0 <7.5.21": 7.5.22
  "esbuild@>=0.28.0 <0.28.1": 0.28.2
  "fastify@>=5 <5.12.5": 5.12.7
  "find-my-way@<9.7.0": 9.10.0
  "@opentelemetry/core@>=2.7.0 <2.8.0": 2.9.0
  "sharp@>=0.34.0 <0.35.0": 0.35.5
permissions:
  "@tanstack/router-plugin":
    skills: false
  fallow:
    skills: false
